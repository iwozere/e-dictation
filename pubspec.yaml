name: e_dictation
description: "e-dictation — structured dictation platform for language teachers and students."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # --- Supabase ---
  supabase_flutter: ^2.8.4

  # --- Audio ---
  just_audio: ^0.9.46
  audio_session: ^0.1.21
  flutter_cache_manager: ^3.4.1

  # --- State management ---
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # --- Routing ---
  go_router: ^15.1.2

  # --- HTTP ---
  dio: ^5.8.0+1

  # --- Utilities ---
  logging: ^1.3.0
  uuid: ^4.5.1
  intl: ^0.20.2
  equatable: ^2.0.7
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.2
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  custom_lint: ^0.7.3
  riverpod_lint: ^2.6.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
