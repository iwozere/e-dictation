name: e_dictation
description: "e-dictation — structured dictation platform for language teachers and students."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # --- Supabase ---
  supabase_flutter: ^2.8.4

  # --- Audio ---
  just_audio: ^0.9.46
  audio_session: ^0.1.21
  flutter_cache_manager: ^3.4.1

  # --- State management ---
  flutter_riverpod: ^2.6.1

  # --- Routing ---
  go_router: ^15.1.2

  # --- HTTP ---
  dio: ^5.8.0+1

  # --- Media ---
  image_picker: ^1.1.2

  # --- Security / hashing ---
  crypto: ^3.0.6

  # --- Local persistence ---
  shared_preferences: ^2.3.2

  # --- Utilities ---
  logging: ^1.3.0
  uuid: ^4.5.1
  intl: ^0.20.2

  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# App launcher icons — regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  # Full-bleed icon for iOS / web / legacy Android (pre-API 26).
  image_path: "web/icons/Icon-512.png"
  remove_alpha_ios: true
  # Android adaptive icon (API 26+): foreground is the safe-zone maskable art,
  # background is the brand blue shown at the cropped corners.
  adaptive_icon_background: "#3D6FF2"
  adaptive_icon_foreground: "web/icons/Icon-maskable-512.png"
