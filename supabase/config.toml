# Supabase local development config — e-dictation
# Full reference: https://supabase.com/docs/guides/local-development

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
# The app sends redirect_to = "${APP_BASE_URL}/reset-password" (defaults to the
# Vercel prod URL). Supabase only honors a redirect_to that matches this list,
# otherwise it falls back to site_url — so both must allow the URLs we send.
site_url = "https://e-dictation.vercel.app"
additional_redirect_urls = [
  "https://e-dictation.vercel.app/**",
  # Flutter web dev server (any localhost port) for local testing.
  "http://localhost:*/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false   # set true in production

[auth.external.google]
enabled = false   # configure in Supabase Dashboard; set true after adding credentials

[functions.on_dictation_save]
verify_jwt = true  # requires a valid Supabase JWT; ownership is re-checked inside the function

[functions.ocr_image]
verify_jwt = true  # requires a valid Supabase JWT (teacher must be signed in)
